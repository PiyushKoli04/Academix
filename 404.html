<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Page Not Found — Academix</title>
  <meta name="description" content="The page you're looking for doesn't exist. Return to Academix to browse engineering notes." />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F4F3F5;
      color: #1a1a1a;
      padding: 20px;
    }
    .error-page {
      text-align: center;
      max-width: 480px;
    }
    .error-page__code {
      font-size: 72px;
      font-weight: 800;
      color: #c5d4a0;
      line-height: 1;
    }
    .error-page__title {
      font-size: 22px;
      font-weight: 700;
      margin: 12px 0 8px;
    }
    .error-page__text {
      font-size: 14px;
      color: #666;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .error-page__btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      background: #1a1a1a;
      color: #fff;
      border-radius: 100px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: transform 0.15s ease;
    }
    .error-page__btn:hover { transform: scale(1.03); }
    .error-page__links {
      margin-top: 20px;
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .error-page__links a {
      font-size: 13px;
      color: #666;
      text-decoration: none;
    }
    .error-page__links a:hover { color: #1a1a1a; }
  </style>
</head>
<body>
  <div class="error-page">
    <p class="error-page__code">404</p>
    <h1 class="error-page__title">Page not found</h1>
    <p class="error-page__text">The page you're looking for doesn't exist or has been moved. Head back to Academix to browse engineering notes and study material.</p>
    <a class="error-page__btn" href="/">← Back to Academix</a>
    <div class="error-page__links">
      <a href="/notes/">Browse Notes</a>
      <a href="/install-app/">Install App</a>
      <a href="/#/library">Library</a>
      <a href="/#/about">About</a>
    </div>
  </div>
</body>
</html>
