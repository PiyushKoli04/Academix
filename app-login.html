<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Academix — Sign in</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:#F4F3F5; color:#1C1C1E; }
    @media (prefers-color-scheme: dark) { body { background:#1C1C1E; color:#F4F3F5; } }
    main { width:min(92vw,380px); text-align:center; padding:32px 20px; }
    img { width:56px; height:56px; border-radius:14px; }
    h1 { font-size:1.25rem; margin:16px 0 6px; }
    p { opacity:.75; line-height:1.5; margin:0 0 20px; }
    button, a.btn { display:inline-block; width:100%; box-sizing:border-box; padding:14px 18px; border:0; border-radius:12px; font:inherit; font-weight:600; background:#1C1C1E; color:#fff; text-decoration:none; cursor:pointer; }
    @media (prefers-color-scheme: dark) { button, a.btn { background:#F4F3F5; color:#1C1C1E; } }
    #msg { margin-top:16px; min-height:1.4em; font-size:.9rem; }
    #back { margin-top:12px; display:none; }
  </style>
</head>
<body>
  <main>
    <img src="./icons/icon-192.png" alt="" />
    <h1 id="title">Sign in to Academix</h1>
    <p id="sub">Continue with the Google account on this phone, then you will return to the app.</p>
    <button id="go" type="button">Continue with Google</button>
    <a id="back" class="btn" href="#">Return to Academix</a>
    <div id="msg" role="status"></div>
  </main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { firebaseConfig, appConfig } from "./firebase.config.js";

const params = new URLSearchParams(location.search);
const mode = params.get("mode") === "drive" ? "drive" : "login";
const nonce = (params.get("nonce") || "").replace(/[^a-zA-Z0-9_-]/g, "").slice(0, 80);
const DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.file";

const go = document.getElementById("go");
const msg = document.getElementById("msg");
const back = document.getElementById("back");

if (mode === "drive") {
  document.getElementById("title").textContent = "Connect Google Drive";
  document.getElementById("sub").textContent = "Allow Academix to manage the files it uploads to your Drive, then you will return to the app.";
  go.textContent = "Allow Drive access";
}

function returnToApp(payload) {
  const query = new URLSearchParams({ nonce, mode, ...payload });
  const url = "academix://auth?" + query.toString();
  back.href = url;
  back.style.display = "inline-block";
  go.style.display = "none";
  msg.textContent = payload.error ? payload.error : "Done. Returning to the app…";
  window.location.href = url;
}

function loadGis() {
  return new Promise((resolve, reject) => {
    if (window.google?.accounts?.oauth2) return resolve();
    const s = document.createElement("script");
    s.src = "https://accounts.google.com/gsi/client";
    s.onload = () => resolve();
    s.onerror = () => reject(new Error("Google sign-in could not be loaded."));
    document.head.append(s);
  });
}

async function signInFirebase() {
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({ prompt: "select_account" });
  const result = await signInWithPopup(auth, provider);
  const credential = GoogleAuthProvider.credentialFromResult(result);
  if (!credential?.idToken) throw new Error("Google did not return a sign-in token.");
  returnToApp({ idToken: credential.idToken, accessToken: credential.accessToken || "" });
}

async function getDriveToken() {
  await loadGis();
  const token = await new Promise((resolve, reject) => {
    const client = window.google.accounts.oauth2.initTokenClient({
      client_id: appConfig.driveUpload.clientId,
      scope: DRIVE_SCOPE,
      callback: (r) => (r?.access_token ? resolve(r) : reject(new Error(r?.error || "Drive access was not granted."))),
      error_callback: (e) => reject(new Error(e?.type || "Drive access was not granted.")),
    });
    client.requestAccessToken({ prompt: "" });
  });
  returnToApp({ driveToken: token.access_token, expiresIn: String(token.expires_in || 3600) });
}

go.addEventListener("click", async () => {
  go.disabled = true;
  msg.textContent = "Opening Google…";
  try {
    if (mode === "drive") await getDriveToken();
    else await signInFirebase();
  } catch (error) {
    go.disabled = false;
    const text = error?.code === "auth/popup-closed-by-user" ? "Sign-in was closed before it finished." : (error?.message || "Sign-in failed. Please try again.");
    msg.textContent = text;
    returnToApp({ error: text });
  }
});
</script>
</body>
</html>
