plugins {
    id 'com.android.application'
}

android {
    namespace 'in.co.syntaxsyndicate.academix'
    compileSdk 34

    defaultConfig {
        applicationId "in.co.syntaxsyndicate.academix"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
