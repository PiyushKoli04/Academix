plugins {
    id 'com.android.application'
}

android {
    namespace 'in.co.syntaxsyndicate.academix'
    compileSdk 34

    defaultConfig {
        applicationId "in.co.syntaxsyndicate.academix"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        academix {
            storeFile file('academix.keystore')
            storePassword 'academix-keystore'
            keyAlias 'academix'
            keyPassword 'academix-keystore'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.academix
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.academix
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
